server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: gateway-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: gateway
          service: gateway
          __path__: /var/log/ms/gateway/*.log

  - job_name: producto-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: producto
          service: producto
          __path__: /var/log/ms/producto/*.log

  - job_name: catalogo-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: catalogo
          service: catalogo
          __path__: /var/log/ms/catalogo/*.log
