global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:7091

  - job_name: producto
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - producto:9092

  - job_name: catalogo
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - catalogo:8082

  - job_name: kafka-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - kafka-exporter:9308

  - job_name: orden-ms
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - orden-ms:9021

  - job_name: pago-ms
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - pago-ms:9031
